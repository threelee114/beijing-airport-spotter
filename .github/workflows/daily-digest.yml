name: Daily Arrivals & Liveries Digest

on:
  schedule:
    # 每天 UTC 12:00 = 北京时间 20:00（发送次日预告）
    - cron: "0 12 * * *"
    # 每天 UTC 22:30 = 北京时间 06:30（发送当日早报补扫，补齐今早刚出炉的国内彩绘排机）
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      airports:
        description: "目标机场三字码，逗号分隔（默认 PEK,PKX；去外地可填如 PVG,SHA 或 CAN 或 CTU,TFU 或 HKG）"
        required: false
        default: ""
      target_date:
        description: "可选：指定目标日期 YYYY-MM-DD（留空则上午查今日、下午/晚上查明日）"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  daily-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore state cache
        uses: actions/cache/restore@v4
        with:
          path: state
          key: spotter-state-daily-${{ github.run_id }}
          restore-keys: |
            spotter-state-

      - name: Run arrivals & liveries digest
        env:
          SMTP_163_USER: ${{ secrets.SMTP_163_USER }}
          SMTP_163_AUTH_CODE: ${{ secrets.SMTP_163_AUTH_CODE }}
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
          TARGET_AIRPORTS: ${{ github.event.inputs.airports || vars.TARGET_AIRPORTS || 'PEK,PKX' }}
        run: |
          ARGS="--state-dir state --airports ${TARGET_AIRPORTS}"
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.target_date }}"
          fi
          python scripts/daily_digest.py $ARGS

      - name: Save state cache (for live alert dedup)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: spotter-state-daily-${{ github.run_id }}
