name: Daily PEK/PKX Arrivals & Liveries Digest

on:
  schedule:
    # 每天 UTC 12:00 = 北京时间 20:00
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "可选：指定目标日期 YYYY-MM-DD（默认明天）"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  daily-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore state cache
        uses: actions/cache/restore@v4
        with:
          path: state
          key: spotter-state-daily-${{ github.run_id }}
          restore-keys: |
            spotter-state-

      - name: Run daily arrivals & liveries digest
        env:
          SMTP_163_USER: ${{ secrets.SMTP_163_USER }}
          SMTP_163_AUTH_CODE: ${{ secrets.SMTP_163_AUTH_CODE }}
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            python scripts/daily_digest.py --state-dir state --date "${{ github.event.inputs.target_date }}"
          else
            python scripts/daily_digest.py --state-dir state
          fi

      - name: Save state cache (for live alert dedup)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: spotter-state-daily-${{ github.run_id }}
